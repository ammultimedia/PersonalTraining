<style>
/*
VOICE: a calm clinic clipboard for a personal trainer.
IDEA: each paper form becomes a live sheet that fills, calculates and prints like the original.
PICTURE: the client's eight numbered forms in order, each turning green when complete.
COLOUR and TYPE: the site's muscle red for actions, white paper sheets, rating bars green→red; Noto Naskh Arabic + Source Sans 3.
LAYOUT: top bar (trainer brand + nav), panel of controls, then the paper sheet. Print shows only the sheet.
*/
:root{--bg:#f4f1ee;--paper:#fff;--ink:#1d1a19;--mute:#655c57;--red:#8c2f25;--line:#d9d1cb;--soft:#f6f2ef;--grn:#2f7a34;--yel:#f2c230;--blue:#0d3b6b}
*{box-sizing:border-box;min-width:0}
input,select,textarea,button,option{font-family:"Noto Naskh Arabic","Source Sans 3",serif}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Naskh Arabic","Source Sans 3",serif;overflow-x:clip}
.en{font-family:"Source Sans 3",system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
a{color:var(--red)}
.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:5}
.topin{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px max(3vw,12px)}
#brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}#brand img{height:40px;max-width:90px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
#brand b{display:block;font-size:18px;line-height:1.2}#brand span{font-size:13px;opacity:.85}
#nav{display:flex;flex-wrap:wrap;gap:4px}#nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:9px;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
#nav a.on{background:rgba(255,255,255,.2);font-weight:700}#nav a:focus-visible,.btn:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:16px max(3vw,10px) 60px}
.panel{background:var(--paper);border-radius:16px;padding:16px 20px;margin-bottom:14px;border:1px solid var(--line)}
h1{font-size:26px;margin:0 0 8px;color:var(--red)}h3{margin:0 0 8px;font-size:18px;color:var(--blue)}h4{margin:10px 0 4px}
.crumb{font-size:14px;margin:0 0 6px;color:var(--mute)}
.privacy{background:#eef6ee;border-radius:10px;padding:8px 12px;font-size:14.5px}
.muted{color:var(--mute)}small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}.btn.danger{color:#a3261c;border-color:#e6b8b2;background:#fff5f4}
.lnk{background:none;border:0;color:var(--red);font:inherit;font-size:13px;cursor:pointer;padding:2px 0;text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.f{font:inherit;font-size:15.5px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink);min-height:40px;width:100%}
.f:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
textarea.f{resize:vertical;min-height:44px;overflow:hidden}

const clsBMI = b => T.bmi.find(r => b < r.max);
function clsBP(s, d) {
  if (!(isFinite(s) && isFinite(d))) return null;

}
const avg2 = (a, b) => { a = num(a); b = num(b); return isFinite(a) && isFinite(b) ? (a + b) / 2 : isFinite(a) ? a : isFinite(b) ? b : NaN; };

      <h4>VT2: اختبار 20 دقيقة · النبض في آخر 5 دقائق</h4>
      <div class="grid5">${[16, 17, 18, 19, 20].map(m => `<label>الدقيقة ${m} ${inp('vt2.' + m, { t: 'num', w: '5em' })}</label>`).join('')}</div>

      <p class="tip">VT1: يصبح التحدث المتواصل «صعبًا لكن ممكنًا» (50% دهون و50% كربوهيدرات). VT2: لأصحاب أهداف الأداء فقط؛ متوسط آخر 5 دقائق × 0.95 (الكتاب ص 357–358).</p></section>

  calc(root = document) {

    const need = sex && isFinite(age) ? '' : '<small>أدخلي جنس العميل وعمره في بياناته</small>';
    const y = ymcaRate(sex, age, num(d.ymca)); o('ymcab', num(d.ymca) ? (y ? bar(T.ymcaCats, y.i) + `<small>الفئة العمرية ${T.ymcaAges[y.ai]}</small>` : need || '<small>لا توجد معايير لهذا العمر</small>') : '');
    const r = rockRate(sex, age, secs(d.rock)); o('rockb', d.rock ? (r ? bar(T.rockCats, r.i) + (r.out ? '<small class="warn">العمر خارج 30–69: التصنيف للاسترشاد فقط</small>' : '') : need) : '');

  },
  status(d) { return !d ? 0 : ['rhr', 'sbp', 'ymca', 'rock', 'run', 'vt1hr'].filter(k => d[k]).length >= 3 ? 2 : Object.keys(d).length > 1 ? 1 : 0; }

  $('#newc').onsubmit = e => { e.preventDefault(); const fdt = new FormData(e.target); const c = { id: uid(), name: fdt.get('name').trim(), sex: fdt.get('sex'), age: fdt.get('age'), created: today(), f: {}, a: [{ id: uid(), date: today(), body: {}, cardio: {} }] }; S.clients.unshift(c); save(1); location.hash = '#/c/' + c.id; };
  $('#expAll').onclick = () => dl(`clients-${today()}.json`, { app: 'nasm-client-file', v: 1, clients: S.clients });
  $('#imp').onchange = e => importFile(e.target.files[0]);
}
function fd(c, id) { if (id === 'body' || id === 'cardio') { const a = cur(c); return a && a[id]; } return c.f && c.f[id]; }
function cur(c) { if (!c.a || !c.a.length) c.a = [{ id: uid(), date: today(), body: {}, cardio: {} }]; return c.a.find(x => x.id === c.cur) || c.a[c.a.length - 1]; }
function dl(name, obj) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function importFile(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); const list = j.clients || (j.client ? [j.client] : []); if (!list.length) throw 0; let n = 0; list.forEach(c => { if (!c.id || !c.name) return; const i = S.clients.findIndex(x => x.id === c.id); if (i >= 0) { if (!confirm(`العميل «${c.name}» موجود. استبداله بالنسخة المستوردة؟`)) return; S.clients[i] = c; } else S.clients.push(c); n++; }); save(1); toast(`تم استيراد ${n}`); route(); } catch (e) { toast('الملف غير صالح', 1); } };
  r.readAsText(file);
}

  bind(() => { if (c.weight || c.height) { } });

  $('#del').onclick = () => { if (confirm(`حذف «${c.name}» وكل بياناته من هذا المتصفح نهائيًا؟ لا يمكن التراجع. (صدّري الملف أولًا إذا تحتاجينه)`)) { S.clients = S.clients.filter(x => x !== c); save(1); location.hash = '#/'; } };

const CONSENT = 'أوافق على إجراء تقييمات الصحة واللياقة البدنية الموضحة في هذا الملف، وأقرّ بأن المعلومات التي قدّمتها صحيحة وكاملة حسب علمي. وأوافق على احتفاظ المدرب بهذه المعلومات لغرض تصميم برنامج التمرين ومتابعة التقدم، على أن تبقى سرية ولا تُشارك مع أي طرف دون موافقتي الكتابية.';

function formSheet(c, id, mode, part) {
  const f = FORMS.find(x => x.id === id);

  if (mode === 'blank') d = {};
  else if (id === 'body' || id === 'cardio') { const a = cur(c); d = a[id] || (a[id] = {}); d.date = a.date; }
  else { c.f[id] = c.f[id] || {}; d = c.f[id]; }
  CTX = { mode, c, d };
  return `<article class="sheet${R[id].land ? ' land' : ''}" data-form="${id}">${R[id].body(part)}</article>`;
}
function vForm(c, id) {

    ${isA ? `<div class="adate">التقييم: <select class="f" id="asel">${c.a.map(x => `<option value="${x.id}"${x === a ? ' selected' : ''}>${x.date}</option>`).join('')}</select> <label>التاريخ <input class="f" type="date" id="adt" value="${a.date}"></label> <button class="btn" id="anew">+ إعادة تقييم جديدة</button></div>` : ''}
    <div class="row"><button class="btn pri" onclick="window.print()">🖨 طباعة / PDF</button>${i > 0 ? `<a class="btn" href="#/c/${c.id}/${FORMS[i - 1].id}">→ السابق</a>` : ''}${i < 7 ? `<a class="btn" href="#/c/${c.id}/${FORMS[i + 1].id}">التالي ←</a>` : ''}</div></section>

  }
}
function printAll(c) {
  const html = `<article class="sheet"><header class="sh">${S.trainer.logo || S.trainer.name ? `<div class="tb">${S.trainer.logo ? `<img src="${S.trainer.logo}" alt="">` : ''}<div><b>${esc(S.trainer.name || '')}</b>${S.trainer.title ? `<span>${esc(S.trainer.title)}</span>` : ''}</div></div>` : ''}<div class="st"><span class="fnum">ملف</span><div><h2>ملف العميل للقياسات</h2><small>${esc(c.name)} · ${sexL(c.sex)} · ${esc(c.age || '')} سنة</small></div></div></header>
    <section class="box"><h3>موافقة العميل</h3><p>${CONSENT}</p>${c.consent && c.consent.sig ? `<img class="psig" src="${c.consent.sig}" alt="توقيع">` : ''}<p>التاريخ: ${esc((c.consent && c.consent.date) || '')}</p></section>
    <section class="box"><h3>ملخص</h3><ul>${FORMS.map(f => `<li>${f.n}. ${f.a}: ${['لم يبدأ (غير مطبوع)', 'جارٍ', 'مكتمل'][R[f.id].status(fd(c, f.id))]}</li>`).join('')}</ul></section>${sheetFoot()}</article>`
    + FORMS.filter(f => R[f.id].status(fd(c, f.id)) > 0).map(f => formSheet(c, f.id, 'view')).join('');

function calcIn(root, id) { R[id].calc(root); }

function vBlank(id) {
  nav('blank');

      <ol class="flist">${BLANKS.map(b => `<li><div class="brow"><span class="fnum">${b.n}</span><span><b>${b.a}</b><small>${b.s}</small></span><span class="acts"><a class="btn" href="#/blank/${b.id}">فتح</a><a class="btn" href="blank/${b.file}.pdf" download>⬇ PDF</a></span></div></li>`).join('')}</ol>
      <p class="muted">PAR-Q+ مقسوم لملفين: الصفحة الأولى (الأسئلة السبعة + الإقرار)، ثم أسئلة المتابعة + التوصيات + الإقرار، لأن من يجيب «لا» على كل أسئلة الصفحة الأولى لا يحتاج الملف الثاني.</p></section>`;

}
const BLANKS = [
  { id: 'parq1', form: 'parq', part: 1, file: '1a-PAR-Q-page1', n: '1أ', a: 'PAR-Q+ 2020: الصفحة الأولى', s: 'الأسئلة السبعة + إقرار المشارك' },
  { id: 'parq2', form: 'parq', part: 2, file: '1b-PAR-Q-followup', n: '1ب', a: 'PAR-Q+ 2020: أسئلة المتابعة', s: 'الأسئلة 1–10 + التوصيات + الإقرار' },
  ...FORMS.slice(1).map(f => ({ id: f.id, form: f.id, file: f.n + '-' + f.id, n: f.n, a: f.a, s: f.s }))
];

function vTables(id) {
  nav('tables');
  if (!id) {
    app().innerHTML = `<section class="panel"><h1>الجداول المرجعية</h1><p>جداول الفصل 11 كما في <span class="en">${REF}</span>، مع رقم الصفحة في الكتاب العربي. يمكن طباعة أي جدول وحده، أو كلها.</p>
      <div class="row np"><a class="btn pri" href="#/tables/all">🖨 عرض وطباعة كل الجداول</a></div>
      <ol class="tlist">${TABLES.map(t => `<li><a href="#/tables/${t.id}"><b>${t.a}</b><small class="en">${t.en}</small><small>الكتاب العربي ${t.ar}</small></a></li>`).join('')}</ol></section>`;

  }

}

function vSettings() {
  nav('settings');
  const tr = S.trainer;
  CTX = { mode: 'edit', d: tr };
  app().innerHTML = `<section class="panel"><h1>إعدادات المدرب</h1><p>يظهر اسمك وشعارك أعلى كل نموذج مطبوع لعملائك. النماذج الفارغة تبقى بدون شعار.</p>
    <div class="box"><div class="grid2"><label>الاسم / اسم النشاط ${inp('name')}</label><label>المسمى أو الشهادة ${inp('title', { ph: 'مدرب شخصي معتمد' })}</label><label>الهاتف ${inp('phone', { im: 'tel' })}</label><label>البريد ${inp('email', { im: 'email' })}</label></div>
    <div class="logo"><div class="lprev">${tr.logo ? `<img src="${tr.logo}" alt="الشعار">` : '<span class="muted">لا يوجد شعار</span>'}</div><label class="btn">رفع الشعار (PNG أو JPG)<input type="file" id="logo" accept="image/*" hidden></label>${tr.logo ? '<button class="btn" id="rmlogo">إزالة الشعار</button>' : ''}</div></div>
    <div class="box"><h3>البيانات</h3><p class="privacy">🔒 كل البيانات في هذا المتصفح فقط. إذا مسحتِ بيانات المتصفح تُحذف، لذلك صدّري نسخة احتياطية بانتظام.</p>
    <div class="row"><button class="btn" id="expAll2">⬇ تصدير كل البيانات</button><button class="btn danger" id="wipe">حذف كل البيانات من هذا المتصفح</button></div></div></section>`;
  bind(() => nav('settings'));
  $('#logo').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 360 / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = im.width * k; cv.height = im.height * k; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); tr.logo = cv.toDataURL('image/png'); save(1); vSettings(); }; im.src = r.result; }; r.readAsDataURL(f); };
  const rm = $('#rmlogo'); if (rm) rm.onclick = () => { delete tr.logo; save(1); vSettings(); };
  $('#expAll2').onclick = () => dl(`client-file-backup-${today()}.json`, { app: 'nasm-client-file', v: 1, trainer: S.trainer, clients: S.clients });
  $('#wipe').onclick = () => { if (confirm('حذف كل العملاء والإعدادات من هذا المتصفح نهائيًا؟')) { S = { trainer: {}, clients: [] }; save(1); vSettings(); } };
}

/* ---------- binding ---------- */
function bind(after, rerender) {
  $$('[data-k]', app()).forEach(el => {
    const k = el.dataset.k;
    const h = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'radio' && !el.checked) return;
      set(CTX.d, k, v); save();
      if (el.tagName === 'TEXTAREA') fit(el);
      if (el.dataset.re && rerender) { const y = scrollY; rerender(); scrollTo(0, y); return; }
      if (el.dataset.re && !rerender) { route(); return; }
      after && after();
    };
    el.addEventListener(el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', h);
    if (el.tagName === 'TEXTAREA') fit(el);
  });
  hydrateSigs(app());
}
const fit = t => { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight, 40) + 'px'; };
function hydrateSigs(root) {
  $$('[data-sig]', root).forEach(box => {
    const k = box.dataset.sig, cv = box.querySelector('canvas'), img = box.querySelector('img');
    if (CTX.mode !== 'edit' || !box.closest('#app')) { cv.remove(); return; }
    const r = box.getBoundingClientRect(); cv.width = r.width * 2 || 600; cv.height = r.height * 2 || 200;
    const g = cv.getContext('2d'); g.lineWidth = 4; g.lineCap = 'round'; g.strokeStyle = '#1d1a19';
    let dn = false, last;
    const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
    cv.onpointerdown = e => { dn = true; last = pt(e); cv.setPointerCapture(e.pointerId); if (img) img.style.display = 'none'; };
    cv.onpointermove = e => { if (!dn) return; const p = pt(e); g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last = p; };
    cv.onpointerup = () => { if (!dn) return; dn = false; set(CTX.d, k, cv.toDataURL('image/png')); save(1); };
  });
  $$('[data-sigclear]', root).forEach(b => b.onclick = () => { set(CTX.d, b.dataset.sigclear, ''); save(1); route(); });
}

/* ---------- router ---------- */
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (p[0] === 'c' && p[1]) { const c = client(p[1]); if (!c) { location.hash = '#/'; return; } c.f = c.f || {}; return p[2] ? vForm(c, p[2]) : vClient(c); }
  if (p[0] === 'blank') return vBlank(p[1]);
  if (p[0] === 'tables') return vTables(p[1]);
  if (p[0] === 'settings') return vSettings();
  vClients();
}
load(); window.addEventListener('hashchange', route); route();
</script>
